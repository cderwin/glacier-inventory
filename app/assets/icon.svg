<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Glacier Inventory</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13294a"/>
      <stop offset="1" stop-color="#0a1628"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <!-- Faint rim so the tile stands out on dark backgrounds -->
  <rect id="rim" x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
  <g transform="translate(0 3)">
    <!-- Back peak: lit and shaded faces -->
    <path d="M42 20 L28 50 L44 50 Z" fill="#2c4a78"/>
    <path d="M42 20 L44 50 L60 50 Z" fill="#1f3860"/>
    <!-- Front peak: lit and shaded faces -->
    <path d="M26 14 L6 50 L28 50 Z" fill="#4d74aa"/>
    <path d="M26 14 L28 50 L46 50 Z" fill="#33568a"/>
    <!-- Snowcaps, split along the same ridge lines -->
    <path d="M42 20 L38.3 28 L40.3 26.8 L42.5 28.3 Z" fill="#f1f6fb"/>
    <path d="M42 20 L42.5 28.3 L44.6 26.9 L46.8 28 Z" fill="#bccde0"/>
    <path d="M26 14 L19.3 26 L22.5 24 L25 26.6 L26.7 25 Z" fill="#f1f6fb"/>
    <path d="M26 14 L26.7 25 L29.6 27.2 L32.7 26 Z" fill="#bccde0"/>
  </g>
</svg>
